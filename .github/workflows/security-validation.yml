name: Security validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen --python ${{ matrix.python }} python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          FRESHDESK_DOMAIN: security-contract.invalid
          FRESHDESK_API_KEY: synthetic-offline-key
      - run: uv pip check
      - run: uv build
      - run: uv export --frozen --no-dev --no-emit-project --no-hashes --output-file security-requirements.txt
      - run: uvx --python ${{ matrix.python }} --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r security-requirements.txt
